# 说明：数据库/Redis 连接与 JWT 密钥均支持环境变量覆盖（${VAR:默认值}）。
# 本地开发直接用默认值即可；部署到服务器时请通过环境变量注入真实凭据，不要把生产密码写进仓库。
server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: parking-server

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/parking_system?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 300000
      max-lifetime: 1200000

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 10MB

mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.parking.entity
  global-config:
    db-config:
      id-type: assign_id
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

knife4j:
  enable: true
  setting:
    language: zh_cn

parking:
  jwt:
    # 生产环境请通过环境变量 JWT_SECRET 注入随机密钥
    secret: ${JWT_SECRET:parking-system-secret-key-2024-parking-lot-management-jwt-token}
    expiration: 86400000
    admin-expiration: 7200000
  reservation:
    grace-period-minutes: 15
  # 上传文件存储目录（头像等），相对路径基于后端启动目录
  upload-dir: ./uploads
