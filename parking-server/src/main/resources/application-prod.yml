# 生产环境配置 — 高并发优化版
# 目标：非高峰 1000+ 用户，高峰 10000+ 用户
# 硬件建议：4核 8G 起步，推荐 8核 16G + MySQL/Redis 独立部署
# 若部署在 2核2G 服务器上，请将 Tomcat threads.max 降到 100、HikariCP maximum-pool-size 降到 20、Redis max-active 降到 16
server:
  tomcat:
    threads:
      max: 400              # 最大工作线程：每线程默认 1MB 栈，400线程约 400MB，配合 8G 堆绰绰有余
      min-spare: 50         # 预热线程：缩短突发流量下的线程创建延迟
    max-connections: 2000   # TCP 连接上限：高峰期短连接频繁，配合 accept-count 抗突刺
    accept-count: 200       # 线程满时的等待队列：避免立即拒绝
    connection-timeout: 20000  # 连接握手超时 20s，防止慢攻击
    keep-alive-timeout: 65000 # 略高于 nginx 默认 60s，避免连接被中途关闭
  # 开启 Gzip 压缩减少网络传输
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html

spring:
  datasource:
    # 生产必须通过环境变量注入数据库密码；未设置时启动失败，避免回落到仓库默认口令
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 20              # 空闲连接保底：减少高峰期建连开销
      maximum-pool-size: 100       # 数据库连接上限：MySQL 默认 max_connections=151，建议调到 200+
      connection-timeout: 30000     # 获取连接等待 30s：避免池耗尽时立即 502
      idle-timeout: 600000          # 空闲 10 分钟回收
      max-lifetime: 1800000         # 30 分钟强制重建：避免 MySQL wait_timeout 8h 触发断连
      leak-detection-threshold: 60000 # 60s 未归还记日志：定位连接泄漏

  data:
    redis:
      lettuce:
        pool:
          max-active: 50    # Redis 连接上限：单个 Redis 实例可轻松承载数千 QPS
          max-idle: 20      # 空闲保底：减少高峰期建连
          min-idle: 10      # 最小空闲：避免冷启动延迟
          max-wait: 3000ms  # 等待连接 3s：避免池耗尽时无限阻塞
        shutdown-timeout: 200ms # 优雅关闭超时

# 生产环境关闭 Swagger/Knife4j UI，节省内存
knife4j:
  enable: false

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

parking:
  # 生产禁止自助充值：未接入真实支付渠道时，不允许调用方指定金额直接入账
  payment:
    mock-enabled: false
  # 生产禁止 deviceId mock 登录：必须接入 code2session，避免知道 deviceId 即可接管账号
  wechat:
    mock-login-enabled: false
