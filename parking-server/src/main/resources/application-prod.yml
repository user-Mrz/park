# 生产环境配置 — 针对 2核2G 服务器优化
server:
  tomcat:
    threads:
      max: 30          # 进一步收紧线程数
      min-spare: 2
    max-connections: 100
  # 开启 Gzip 压缩减少网络传输
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/html

spring:
  datasource:
    hikari:
      minimum-idle: 1
      maximum-pool-size: 3

  data:
    redis:
      lettuce:
        pool:
          max-active: 2
          max-idle: 1
          min-idle: 1

# 生产环境关闭 Swagger/Knife4j UI，节省内存
knife4j:
  enable: false

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl
